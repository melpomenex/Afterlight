<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Afterlight — Atmosphere Harness</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; overflow: hidden; background: #141d1c; font: 12px/1.5 "Space Mono", ui-monospace, monospace; color: #e8e2cf; }
    #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #panel {
      position: fixed; top: 12px; left: 12px; z-index: 2; width: 288px;
      background: rgba(16, 28, 30, 0.82); border: 1px solid rgba(159, 170, 146, 0.35);
      border-radius: 10px 4px 10px 4px; padding: 12px 14px; backdrop-filter: blur(6px);
    }
    #panel h1 { font-size: 11px; letter-spacing: 0.18em; margin: 0 0 8px; color: #e7c889; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
    .row label { color: #9faa92; letter-spacing: 0.08em; font-size: 10px; }
    select, button, input[type="range"] { font: inherit; color: inherit; }
    select { background: #1d2c2c; border: 1px solid #40554f; border-radius: 4px; padding: 2px 4px; max-width: 150px; }
    button { background: #24393b; border: 1px solid #40554f; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #e7c889; }
    #counters { margin-top: 8px; border-top: 1px solid rgba(159,170,146,.25); padding-top: 6px; white-space: pre-line; color: #b9c4ad; font-size: 10px; }
    #hint { margin-top: 6px; color: #7d8a7b; font-size: 10px; }
  </style>
</head>
<body>
  <canvas id="world" aria-label="Atmosphere harness scene: a wet plaza with an arcade cover, rain, puddles and lamps"></canvas>
  <div id="panel">
    <h1>ATMOSPHERE HARNESS</h1>
    <div class="row"><label for="preset">PRESET</label>
      <select id="preset">
        <option value="rain" selected>rain (fixed)</option>
        <option value="storm">storm (fixed)</option>
        <option value="clear">clear (fixed)</option>
        <option value="dry-heat">dry-heat (fixed)</option>
        <option value="diurnal-rain">diurnal-rain (scheduled)</option>
      </select>
    </div>
    <div class="row"><label for="quality">QUALITY</label>
      <select id="quality"><option value="normal" selected>normal</option><option value="reduced">reduced</option></select>
    </div>
    <div class="row"><label>SHARED EVENT</label>
      <span style="display:flex;gap:6px">
        <button id="lightning" title="Emit a shared lightning event 2.5s ahead on the server clock">⚡ lightning</button>
        <button id="meteor" title="Emit a shared meteor event 2.5s ahead (handler slot; no visual yet)">☄ meteor</button>
      </span>
    </div>
    <div class="row"><label for="flash">FLASHES</label>
      <select id="flash"><option value="reduced" selected>softened</option><option value="off">off</option></select>
    </div>
    <div class="row"><label for="zone">AUDIO ZONE</label>
      <select id="zone">
        <option value="exposed" selected>exposed</option>
        <option value="roof">roof (arcade)</option>
        <option value="alcove">alcove</option>
      </select>
    </div>
    <div class="row"><label for="sound">AUDIO</label>
      <button id="sound" title="Start or stop the synthesized environmental loops (user gesture)">♫ sound on</button>
    </div>
    <div class="row"><label for="camera">CAMERA</label>
      <button id="camera" title="Cycle camera mode (C)">iso 1 / 3</button>
    </div>
    <div class="row"><label for="seek">SERVER TIME</label>
      <input id="seek" type="range" min="0" max="1440000" value="600000" step="1000" style="width:150px" />
    </div>
    <div class="row"><label>TIME</label><span id="clock-readout">phase 0.42</span></div>
    <div class="row"><label for="play">CLOCK</label>
      <button id="play" title="Pause or resume the server clock">⏸ pause</button>
    </div>
    <div id="counters" aria-live="off">booting…</div>
    <div id="hint">Drag in first person to look. The arcade (west) is an authored cover zone; its roof edge runs runoff.</div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>

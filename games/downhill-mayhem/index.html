<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DOWNHILL MAYHEM — free fan-made downhill racing tribute</title>
<meta name="description" content="Free PS2-style downhill mountain-bike racing in your browser: 6 riders, big-air tricks that charge boost, and punches that settle the rest.">
<meta property="og:title" content="DOWNHILL MAYHEM — free PS2-style downhill racing">
<meta property="og:type" content="website">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0e12; touch-action:manipulation; }
  body { font-family:"Arial Black","Arial Bold",Impact,"Helvetica Neue",Arial,sans-serif; user-select:none; -webkit-user-select:none; color:#fff; }
  #wrap { position:fixed; inset:0; touch-action:none; }
  #gl { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #fx { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; }
  #crt { position:absolute; inset:0; z-index:3; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0px, rgba(0,0,0,.14) 1px, transparent 1px, transparent 3px); }
  #vig { position:absolute; inset:0; z-index:3; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,10,.38) 100%); }
  #crt.off, #vig.off, [hidden] { display:none !important; }
  #fatal { position:absolute; inset:0; z-index:9; display:flex; align-items:center; justify-content:center;
    color:#fff; background:#301010; font-size:16px; padding:30px; text-align:center; }

  /* ---- HUD root + readouts ---- */
  .dm-hudroot { position:absolute; inset:0; z-index:4; pointer-events:none; font-style:italic;
    text-shadow:3px 3px 0 rgba(0,0,0,.85); }
  .dm-hud { position:absolute; inset:0; }
  .dm-pos { position:absolute; top:18px; left:22px; line-height:.9; }
  .dm-pos .dm-big { font-size:56px; color:#ffd23f; letter-spacing:-2px; }
  .dm-pos .dm-small { font-size:20px; color:#fff; }
  .dm-gap { position:absolute; top:80px; left:24px; font-size:16px; }
  .dm-timer { position:absolute; top:18px; left:50%; transform:translateX(-50%) skewX(-6deg); font-size:30px; letter-spacing:1px; }
  .dm-mode { position:absolute; top:50px; left:50%; transform:translateX(-50%) skewX(-6deg); font-size:14px; color:#ffd23f; }
  .dm-target { position:absolute; top:70px; left:50%; transform:translateX(-50%) skewX(-6deg); font-size:15px; color:#59ff7a; }
  .dm-speed { position:absolute; right:26px; bottom:20px; text-align:right; line-height:.85; transform:skewX(-6deg); }
  .dm-speed .dm-num { font-size:72px; letter-spacing:-3px; }
  .dm-speed .dm-unit { font-size:18px; color:#ffd23f; }
  .dm-boost { position:absolute; left:22px; bottom:26px; width:230px; }
  .dm-boost .dm-label { font-size:14px; margin-bottom:4px; color:#ffd23f; letter-spacing:2px; }
  .dm-boost .dm-bar { width:100%; height:20px; border:3px solid #fff; background:rgba(0,0,0,.45); box-shadow:3px 3px 0 rgba(0,0,0,.85); }
  .dm-boost .dm-fill { height:100%; width:0%; background:linear-gradient(90deg,#ff8a00,#ff3d00); }
  .dm-prog { position:absolute; right:22px; top:50%; transform:translateY(-50%); width:10px; height:56vh;
    border:3px solid #fff; background:rgba(0,0,0,.4); box-shadow:3px 3px 0 rgba(0,0,0,.85); }
  .dm-prog .dm-dot { position:absolute; left:50%; width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%; border:2px solid #000; }
  .dm-prog .dm-dot.dm-me { width:16px; height:16px; margin:-8px 0 0 -8px; border:3px solid #fff; z-index:2; }
  .dm-prog .dm-flag { position:absolute; bottom:-24px; left:50%; transform:translateX(-50%); font-size:15px; font-style:normal; }
  .dm-trick { position:absolute; left:50%; top:57%; width:170px; height:10px; margin-left:-85px;
    border:2px solid #fff; background:rgba(0,0,0,.45); transform:skewX(-8deg); }
  .dm-trick .dm-fill { height:100%; width:0%; background:#ff5040; }
  .dm-count { position:absolute; left:50%; top:38%; transform:translate(-50%,-50%); font-size:150px; color:#ffd23f; text-shadow:6px 6px 0 rgba(0,0,0,.85); }
  .dm-hint { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); font-size:12px; color:rgba(255,255,255,.75);
    font-style:normal; text-shadow:2px 2px 0 rgba(0,0,0,.8); transition:opacity 1s; white-space:nowrap; }

  /* ---- popups + hit flash (effects.js) ---- */
  .dm-popups { position:absolute; left:50%; top:32%; transform:translateX(-50%); text-align:center; width:80%; }
  .dm-pop { font-size:42px; color:#ffd23f; letter-spacing:1px; transform:skewX(-8deg); animation:dmPop 1.3s ease-out forwards; margin-top:4px; }
  .dm-pop.dm-small { font-size:24px; color:#fff; animation-duration:.8s; }
  .dm-pop.dm-bad { color:#ff5040; }
  .dm-pop.dm-pow { color:#fff; font-size:52px; }
  .dm-pop.dm-go { color:#59ff7a; font-size:110px; }
  .dm-pop.dm-pb { color:#ffd23f; font-size:48px; }
  @keyframes dmPop { 0%{opacity:0; transform:skewX(-8deg) scale(.4);} 12%{opacity:1; transform:skewX(-8deg) scale(1.12);}
    24%{transform:skewX(-8deg) scale(1);} 70%{opacity:1;} 100%{opacity:0; transform:skewX(-8deg) scale(1) translateY(-46px);} }
  .dm-hitflash { position:absolute; inset:0; pointer-events:none; opacity:0;
    background:radial-gradient(ellipse at center, rgba(255,40,20,.12) 30%, rgba(255,30,15,.5) 100%); }
  .dm-hitflash.dm-flash { animation:dmHit .5s ease-out; }
  @keyframes dmHit { 0%{opacity:1;} 100%{opacity:0;} }

  /* ---- title ---- */
  .dm-title { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(180deg, rgba(8,12,20,.30), rgba(8,12,20,.62)); text-align:center; padding:8px 0 58px; }
  .dm-logo { font-style:italic; line-height:.82; letter-spacing:-2px; transform:skewX(-8deg) rotate(-2deg); display:flex; flex-direction:column; }
  .dm-logo .dm-l1 { font-size:min(11vw,92px); color:#fff; text-shadow:3px 3px 0 #143, 6px 6px 0 rgba(0,0,0,.9); }
  .dm-logo .dm-l2 { font-size:min(14vw,120px); color:#ffd23f; text-shadow:3px 3px 0 #a33, 7px 7px 0 rgba(0,0,0,.9); }
  .dm-tag { margin-top:14px; font-size:15px; color:#cfe; text-shadow:2px 2px 0 #000; }
  .dm-best { margin-top:8px; font-size:17px; color:#ffd23f; text-shadow:2px 2px 0 #000; letter-spacing:1px; }
  .dm-chal { margin-top:4px; font-size:16px; color:#59ff7a; text-shadow:2px 2px 0 #000; letter-spacing:1px; }
  .dm-sel { margin-top:8px; font-size:16px; color:#9fd; text-shadow:2px 2px 0 #000; letter-spacing:1px; }
  .dm-press { margin-top:26px; font-size:26px; color:#fff; text-shadow:3px 3px 0 #000; animation:dmBlink 1.1s steps(2) infinite; }
  @keyframes dmBlink { 50% { opacity:.15; } }

  /* ---- results ---- */
  .dm-results { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(5,8,14,.45); overflow-y:auto; }
  .dm-respanel { position:relative; background:rgba(0,0,0,.72); border:3px solid #fff; box-shadow:6px 6px 0 rgba(0,0,0,.7);
    padding:22px 34px; min-width:min(480px,92vw); margin:auto; }
  .dm-restitle { font-size:44px; color:#ffd23f; text-shadow:3px 3px 0 #000; text-align:center; }
  .dm-resmode { text-align:center; font-size:14px; margin:1px 0 8px; color:#ffd23f; letter-spacing:2px; }
  .dm-reschal { text-align:center; margin:8px auto 4px; padding:6px 16px; width:fit-content; max-width:92%;
    font-weight:900; font-size:20px; border:3px solid currentColor; border-radius:6px; }
  .dm-reschal.dm-win { color:#59ff7a; background:rgba(40,180,90,.16); }
  .dm-reschal.dm-lose { color:#ff7a6f; background:rgba(200,60,50,.16); }
  .dm-ressub { text-align:center; font-size:15px; margin:2px 0 8px; color:#9fd; }
  .dm-restable { width:100%; border-collapse:collapse; font-size:17px; }
  .dm-restable td { padding:5px 10px; border-bottom:1px solid rgba(255,255,255,.18); }
  .dm-restable tr.dm-me td { color:#ffd23f; background:rgba(255,210,63,.12); }
  .dm-restable .dm-chip { display:inline-block; width:13px; height:13px; border:1px solid #000; margin-right:7px; }
  .dm-resagain { margin-top:18px; font-size:20px; color:#fff; animation:dmBlink 1.2s steps(2) infinite; text-align:center; }

  /* ---- touch ---- */
  #touchUI { position:absolute; inset:0; z-index:5; pointer-events:none; font-style:normal; display:none; }
  body.touch #touchUI { display:block; }
  .tbtn { position:absolute; pointer-events:auto; display:flex; align-items:center; justify-content:center;
    border:3px solid rgba(255,255,255,.85); border-radius:50%; background:rgba(10,14,22,.38);
    color:#fff; font-weight:900; font-size:15px; text-shadow:2px 2px 0 rgba(0,0,0,.8); touch-action:none;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  .tbtn.on, .tbtn:active { background:rgba(255,140,0,.6); border-color:#ffd23f; }
  #tLeft  { left:14px; bottom:16px; width:86px; height:86px; font-size:34px; }
  #tRight { left:114px; bottom:16px; width:86px; height:86px; font-size:34px; }
  #tBrake { left:58px; bottom:116px; width:64px; height:64px; font-size:12px; }
  #tJump  { right:14px; bottom:16px; width:92px; height:92px; }
  #tPunch { right:116px; bottom:14px; width:66px; height:66px; font-size:26px; }
  #tKick  { right:190px; bottom:26px; width:60px; height:60px; font-size:24px; }
  #tBoost { right:140px; bottom:142px; width:74px; height:74px; font-size:14px; }
  .tbtn.trick { width:56px; height:56px; font-size:10px; }
  #tT1 { right:16px; bottom:122px; } #tT2 { right:74px; bottom:122px; }
  #tT3 { right:16px; bottom:182px; } #tT4 { right:74px; bottom:182px; }

  @media (max-width:940px){
    .dm-pos .dm-big { font-size:38px; } .dm-pos .dm-small { font-size:15px; }
    .dm-timer { font-size:20px; } .dm-count { font-size:92px; }
    .dm-pop { font-size:27px; } .dm-restitle { font-size:32px; } .dm-restable { font-size:14px; }
    .dm-logo .dm-l1 { font-size:min(11vw,64px); } .dm-logo .dm-l2 { font-size:min(14vw,84px); }
  }

  #attrib { position:absolute; bottom:10px; left:0; width:100%; z-index:4; pointer-events:none; text-align:center;
    font-family:"Helvetica Neue",Arial,sans-serif; font-size:11px; color:rgba(255,255,255,.72); text-shadow:1px 1px 0 #000; }
  #attrib a { color:#8fb8ff; text-decoration:none; pointer-events:auto; }
  #attrib a:hover { text-decoration:underline; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="fx"></canvas>
  <div id="crt"></div>
  <div id="vig"></div>
  <div id="dm-hud-host"></div>
  <div id="touchUI">
    <div class="tbtn" id="tLeft">◀</div>
    <div class="tbtn" id="tRight">▶</div>
    <div class="tbtn" id="tBrake">BRAKE</div>
    <div class="tbtn" id="tJump">JUMP</div>
    <div class="tbtn" id="tPunch">👊</div>
    <div class="tbtn" id="tKick">🦶</div>
    <div class="tbtn" id="tBoost">BOOST</div>
    <div class="tbtn trick" id="tT1">NO<br>HAND</div>
    <div class="tbtn trick" id="tT2">SUPER<br>MAN</div>
    <div class="tbtn trick" id="tT3">HEEL<br>CLICK</div>
    <div class="tbtn trick" id="tT4">BACK<br>FLIP</div>
  </div>
  <div id="fatal" hidden></div>
  <div id="attrib">Fan-made tribute · Not affiliated with Sony · No original game assets · three.js (MIT) ·
    <a href="https://github.com/pranshuparmar/downhill-mayhem" target="_blank" rel="noopener">github.com/pranshuparmar/downhill-mayhem</a></div>
</div>
<script type="module">
  import { bootStandalone } from './src/standalone.js';
  bootStandalone();
  if (('ontouchstart' in window) || navigator.maxTouchPoints > 0) {
    if (window.matchMedia && window.matchMedia('(pointer:coarse)').matches) document.body.classList.add('touch');
  }
</script>
</body>
</html>
